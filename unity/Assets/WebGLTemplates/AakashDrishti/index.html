<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* The build is meant to live in an iframe: the canvas simply fills whatever box it is given. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0e14; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 14px; color: #c9d3e0; font: 15px system-ui, sans-serif; background: #0b0e14; }
      #boot-bar { width: 260px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
      #boot-fill { width: 0%; height: 100%; background: #2985e6; transition: width .1s linear; }
      #boot-error { color: #ff7366; max-width: 480px; text-align: center; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="1"></canvas>
    <div id="boot">
      <div id="boot-label">Loading viewer&hellip;</div>
      <div id="boot-bar"><div id="boot-fill"></div></div>
      <div id="boot-error"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var boot = document.querySelector("#boot");

      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.querySelector("#boot-fill").style.width = Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        // Exposed so the host page (same-origin) or the console can call
        // window.unityInstance.SendMessage("ViewerBootstrap", "LoadJob", '{"api":"...","job":"..."}').
        window.unityInstance = unityInstance;
        boot.style.display = "none";
        canvas.focus();
        canvas.addEventListener("pointerdown", function () { canvas.focus(); });
        // The wheel zooms the terrain; without this the page behind the iframe scrolls at the same time.
        canvas.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
      }).catch(function (message) {
        document.querySelector("#boot-label").textContent = "The viewer failed to start";
        document.querySelector("#boot-error").textContent = String(message);
      });
    </script>
  </body>
</html>
